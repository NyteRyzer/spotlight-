name: Build

# Every push builds and tests both platforms and uploads the installers as
# workflow artifacts. Pushing a tag like v0.1.0 (or running the workflow by
# hand with a release tag) also publishes them on a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ ffmpeg file xvfb xauth \
            qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev qt6-qpa-plugins \
            libqt6multimedia6 libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package (.deb / .tar.gz)
        run: cd build && cpack
      - name: Package (AppImage)
        run: packaging/linux/build-appimage.sh build-appimage
      - name: Smoke test AppImage
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 10 xvfb-run -a build-appimage/SPOTLIGHT-*.AppImage
          code=$?
          # 124 = still running when the timeout stopped it, i.e. it started fine.
          [ "$code" -eq 124 ] || { echo "AppImage exited early with $code"; exit 1; }
          set -e
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a build-appimage/SPOTLIGHT-*.AppImage --self-test "$RUNNER_TEMP/self-test"
      - uses: actions/upload-artifact@v4
        with:
          name: spotlight-linux
          path: |
            build/*.deb
            build/*.tar.gz
            build-appimage/SPOTLIGHT-*.AppImage

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install qt ffmpeg ninja
      - name: App icon
        run: packaging/macos/make-icns.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package (.dmg)
        run: packaging/macos/build-dmg.sh build-dmg
      - name: Verify the .dmg (signature, self-test, launch)
        run: packaging/macos/verify-dmg.sh build-dmg/*.dmg arm64
      - uses: actions/upload-artifact@v4
        with:
          name: spotlight-macos
          path: build-dmg/*.dmg

  macos-intel:
    name: macOS (Intel)
    # Built against the official Qt 6.8 LTS binaries (macOS 12+) and static
    # FFmpeg, because Homebrew bottles on this runner require macOS 15.
    runs-on: macos-15-intel
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          brew install ninja
          python3 -m pip install --break-system-packages aqtinstall
      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          python3 -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -m qtmultimedia --outputdir "$HOME/Qt"
          echo "QT_PREFIX=$HOME/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"
      - name: Fetch static FFmpeg
        run: |
          packaging/macos/fetch-ffmpeg.sh "$HOME/ffmpeg-static" x86_64
          echo "FFMPEG_BIN=$HOME/ffmpeg-static" >> "$GITHUB_ENV"
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
      - name: App icon
        run: packaging/macos/make-icns.sh
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package (.dmg)
        run: packaging/macos/build-dmg.sh build-dmg
        env:
          DEPLOY_TARGET: '12.0'
          DMG_LABEL: Intel
      - name: Check architecture and minimum macOS
        run: |
          APP=build-dmg/dmg/SPOTLIGHT.app
          lipo -archs "$APP/Contents/MacOS/SPOTLIGHT"
          lipo -archs "$APP/Contents/MacOS/SPOTLIGHT" | grep -qw x86_64
          vtool -show-build "$APP/Contents/MacOS/SPOTLIGHT" | grep -E 'minos|version' | head -3
      - name: Verify the .dmg (signature, self-test, launch)
        run: |
          # Hide the build machine's FFmpeg so the app must use its bundled copy.
          rm -rf "$HOME/ffmpeg-static"
          packaging/macos/verify-dmg.sh build-dmg/*.dmg x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: spotlight-macos-intel
          path: build-dmg/*.dmg

  release:
    name: Publish release
    needs: [linux, macos, macos-intel]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: find dist -type f -exec ls -la {} +
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: SPOTLIGHT! ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          # Artifacts keep their folders (build/, build-appimage/, ...).
          files: |
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.tar.gz
          fail_on_unmatched_files: true
          body: |
            Downloads for SPOTLIGHT! — all-in-one video, audio and design studio.

            **macOS — Apple Silicon (M1/M2/M3/M4…, macOS 14 Sonoma or newer)** — `SPOTLIGHT-*-macOS-arm64.dmg`
            **macOS — Intel (macOS 12 Monterey or newer)** — `SPOTLIGHT-*-macOS-Intel.dmg`
            Not sure which? Apple menu → About This Mac: "Chip: Apple M…" = Apple Silicon, "Processor: Intel" = Intel.
            Open the .dmg and drag SPOTLIGHT! to Applications. The app isn't notarized yet, so the first time
            macOS will block it: open **System Settings → Privacy & Security** and click **Open Anyway**
            (or run `xattr -dr com.apple.quarantine /Applications/SPOTLIGHT.app`).

            **Linux (x86_64)**
            * `SPOTLIGHT-*-x86_64.AppImage` — portable, no install: `chmod +x SPOTLIGHT-*.AppImage && ./SPOTLIGHT-*.AppImage`
              (needs a distro from 2024 or newer, e.g. Ubuntu 24.04, Fedora 40, Debian 13)
            * `spotlight-*-linux-x86_64.deb` — Ubuntu 24.04 / Debian 13: `sudo apt install ./spotlight-*.deb`
            * `spotlight-*-linux-x86_64.tar.gz` — plain binaries

            FFmpeg is bundled in the .dmg and the AppImage; the .deb installs it as a dependency.
